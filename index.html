<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jacob Kosinski | Profile</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="profile-page">
    <section class="profile-card">
      <div class="banner"></div>
      <div class="profile-main">
        <div class="headshot-container">
          <img src="https://via.placeholder.com/220x220.png?text=Headshot" alt="Headshot placeholder" class="headshot">
        </div>
        <div class="profile-heading">
          <h1>Jacob Kosinski</h1>
          <p class="headline">Computer Engineering Student | Researcher | Developer</p>
          <p class="location">United States</p>
        </div>
      </div>
    </section>

    <section class="content-grid">
      <article class="panel">
        <h2>Resume Information</h2>
        <p class="panel-intro">Fill out your profile details below.</p>
        <form class="resume-form">
          <label for="full-name">Full Name</label>
          <input id="full-name" type="text" placeholder="Enter your full name">

          <label for="current-role">Current Role</label>
          <input id="current-role" type="text" placeholder="Ex: Undergraduate Research Assistant">

          <label for="education">Education</label>
          <input id="education" type="text" placeholder="Ex: B.S. Computer Engineering, XYZ University">

          <label for="experience">Experience Summary</label>
          <textarea id="experience" rows="4" placeholder="Briefly describe your relevant experience"></textarea>

          <label for="skills">Skills</label>
          <textarea id="skills" rows="3" placeholder="Ex: Python, C++, Embedded Systems, Data Analysis"></textarea>
        </form>
      </article>

      <article class="panel">
        <h2>Research Paper</h2>
        <p class="panel-intro">Add a direct link to your published work.</p>
        <label for="paper-link">Research Paper URL</label>
        <input id="paper-link" type="url" placeholder="https://example.com/research-paper">
        <a class="resource-link" href="#" aria-label="Research paper link placeholder">Open Research Paper</a>
      </article>

      <article class="panel">
        <h2>Projects</h2>
        <p class="panel-intro">Share links to your key projects.</p>
        <label for="project-one">Project 1 URL</label>
        <input id="project-one" type="url" placeholder="https://github.com/username/project-one">

        <label for="project-two">Project 2 URL</label>
        <input id="project-two" type="url" placeholder="https://github.com/username/project-two">

        <label for="project-three">Project 3 URL</label>
        <input id="project-three" type="url" placeholder="https://github.com/username/project-three">
      </article>
    </section>
  </main>
</body>
</html>
